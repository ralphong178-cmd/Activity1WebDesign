<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Enrollment Form</title>
</head>
<body>
    <h1>College Enrollment Form</h1>
    <table border="0" align="center" width="100px" cellpading="50px" cellspacing="30px"> </table>
    <form action="saved.hmtl" method="get">
        <tr>
             <td><label for="">Full Name*</label></td> <br>  
             <td><input type="text" name="" id="" placeholder="Please Enter Name" required></td><br>
        </tr>
        <tr>
             <td><label for="">Middle Name</label></td><br>
             <td><input type="text" name="" id="" placeholder="Please Enter Middle Name" required></td><br>
        </tr>
        <tr>
            <td><label for="">Last Name*</label> </td><br>
            <td><input type="text" name="" id="" placeholder="Please Enter Name" required></td><br>
        </tr>
        <tr>
            <td><label for="">BirthDay*</label> </td><br>
            <td><input type="date" name="" id="" ></td><br>
        </tr>
        <tr>
            <td><label for="">Birthplace*</label> </td><br>
            <td><input type="text" name="" id=""></td><br>
        </tr>
        <tr>
            <td><label for="">Age*</label> </td><br>
            <td><input type="text" name="" id=""></td><br>
        </tr>
        <tr>
            <td><label for="">Year Level*</label></td>
            <td><select name="" id="">
            <option value="">Select Year Level</option>
            <option value="">1st Year</option>
            <option value="">2st Year</option>
            <option value="">3rd Year</option>
            <option value="">4th Year</option>
        </select></td>
        </tr><br>
        <tr>
        <td><label for="">Course*</label> </td>
        <td><select name="" id="">
            <option value="">Select Course</option>
            <option value="">ACT (Associate in Computer Technology)</option>
            <option value="">BSOA (Business Office Administration)</option>
            <option value="">ENTREP (Entrepreneurship)</option>
            <option value="">HM (Hospitality Management)</option>
            <option value="">CT (Computer Technology)</option>
        </select></td>
        </tr><br>
        <tr>
            <td><label for="">CitizenShip*</label> </td>
            <td><input type="text" name="" id="" placeholder="Filipino"></td>
        </tr><br>
        <tr>
        <td><label for="">Sex*</label></td>
        <td><input type="radio" name="gender" id="m" > <label for="m">Male</label>
        <input type="radio" name="gender" id="f" > <label for="f">Female</label>
        </td>
        </tr><br>
        <tr>
        <td><label for="">Civil Status*</label></td> 
        <td><select name="" id="">
            <option value="">Single</option>
            <option value="">Married</option>
            <option value="">Divorced</option>
            <option value="">widowed</option>
        </select></td>
        </tr><br>
        <tr>
        <td><label for="">Region*</label> </td> <br>
        <td><input type="text" name="" id=""> </td> <br>
       <td><label for="">Province*</label></td> <br>
        <td><input type="text" name="" id=""></td> <br>
       <td><label for="">City*</label> </td>  <br>
      <td><input type="text" name="" id=""></td>  <br>
        <td><label for="">Barangay*</label></td><br>
        <td><input type="text" name="" id=""></td><br>
       <td><label for="">House No./Street*</label> </td> <br>
        <td><input type="text" name="" id=""></td><br>
        <td><label for="">Contact No.*</label></td><br>
       <td><input type="text" name="" id=""></td> <br>
        </tr><br>
        <tr>
        <td><label for="" style="text-align: center;">Credentials Submitted*</label></td>
        <td><input type="checkbox" name="" id=""> Form-138(High School Card) <br>
        <input type="checkbox" name="" id=""> Form-137 <br>
        <input type="checkbox" name="" id=""> Birth Certificate <br>
        <input type="checkbox" name="" id=""> Good Moral Certificate <br>
        <input type="checkbox" name="" id=""> Certificate of Transfer Credentials <br>
        <input type="checkbox" name="" id=""> Transcript of Records <br>
        <input type="checkbox" name="" id=""> Summer Permit / Permit to Cross Enroll <br>
        <input type="checkbox" name="" id=""> Picture <br>
        <input type="checkbox" name="" id=""> PSA / NSO <br>
        </td></tr><br>
        <input type="Submit" value="Submit">
        <input type="Reset" value="Clear">
    </form>
    </table>
</body>
</html>
